apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: protoprompt-memory
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: protoprompt-memory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: protoprompt-memory
  template:
    metadata:
      labels:
        app: protoprompt-memory
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: protoprompt-fastapi:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PROTOPROMPT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: protoprompt-api
                  key: api-key
            - name: PROTOPROMPT_TENANT
              value: demo
            - name: PROTOPROMPT_USER
              value: demo-user
            - name: PROTOPROMPT_DB
              value: /data/memory.db
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: protoprompt-memory
---
apiVersion: v1
kind: Service
metadata:
  name: protoprompt-memory
spec:
  selector:
    app: protoprompt-memory
  ports:
    - name: http
      port: 80
      targetPort: http
