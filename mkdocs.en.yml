site_name: protoprompt
site_description: Layered context builder for LLM prompts
site_url: https://idxeed.github.io/protoprompt/
repo_url: https://github.com/Idxeed/protoprompt
repo_name: Idxeed/protoprompt
copyright: MIT

docs_dir: docs/en
site_dir: site/en

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  alternate:
    - name: Русский
      link: /ru/
      lang: ru

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - Context layers: concepts/context.md
      - Compression: concepts/compression.md
      - Token budget: concepts/budget.md
  - Memory:
      - RAG retrieval: rag.md
      - User profile: profile.md
      - Secrets: secrets.md
  - Integrations: integrations.md
  - MCP server: mcp.md
  - OpenAI Agents SDK: openai-agents.md
  - LangGraph: langgraph.md
  - Telegram memory bot: telegram.md
  - PostgreSQL and pgvector: postgres.md
  - OpenTelemetry: opentelemetry.md
  - Redis: redis.md
  - Elasticsearch and OpenSearch: search.md
  - FastAPI service: fastapi.md
  - Local document readers: readers.md
  - Providers and frameworks: providers-frameworks.md
  - Migrating 0.3 → 0.4: migration-0.4.md
  - Migrating 0.3 → 0.6: migration-0.6.md
  - Changelog: changelog.md
  - License: license.md
