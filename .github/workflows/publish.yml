name: publish

on:
  # Manual runs are release-candidate uploads to TestPyPI.
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Every job starts without a token. Grant only the capability its work requires.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: protoprompt_test
          POSTGRES_USER: protoprompt
          POSTGRES_PASSWORD: protoprompt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protoprompt -d protoprompt_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PROTOPROMPT_POSTGRES_DSN: postgresql://protoprompt:protoprompt@localhost:5432/protoprompt_test
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[chroma,qdrant,postgres,dev]" "./apps/agent-cli" "./apps/ollama-chat[dev]"
          python -m pip install build twine

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          app_version="$(python -c 'import tomllib; print(tomllib.load(open("apps/ollama-chat/pyproject.toml", "rb"))["project"]["version"])')"
          agent_cli_version="$(python -c 'import tomllib; print(tomllib.load(open("apps/agent-cli/pyproject.toml", "rb"))["project"]["version"])')"
          runtime_version="$(python -c 'from protoprompt import __version__; print(__version__)')"
          app_runtime_version="$(python -c 'from protoprompt_ollama_chat import __version__; print(__version__)')"
          agent_cli_runtime_version="$(python -c 'from protoprompt_cli import __version__; print(__version__)')"
          expected_tag="v${package_version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "tag ${RELEASE_TAG} does not match package version ${expected_tag}" >&2
            exit 1
          fi
          if [[ "${app_version}" != "${package_version}" ]]; then
            echo "ollama reference app version ${app_version} does not match ${package_version}" >&2
            exit 1
          fi
          if [[ "${agent_cli_version}" != "${package_version}" ]]; then
            echo "agent CLI version ${agent_cli_version} does not match ${package_version}" >&2
            exit 1
          fi
          if [[ "${runtime_version}" != "${package_version}" ]]; then
            echo "protoprompt runtime version ${runtime_version} does not match ${package_version}" >&2
            exit 1
          fi
          if [[ "${app_runtime_version}" != "${package_version}" ]]; then
            echo "ollama reference app runtime version ${app_runtime_version} does not match ${package_version}" >&2
            exit 1
          fi
          if [[ "${agent_cli_runtime_version}" != "${package_version}" ]]; then
            echo "agent CLI runtime version ${agent_cli_runtime_version} does not match ${package_version}" >&2
            exit 1
          fi

      - name: Run deterministic library tests
        run: |
          python -m pytest -q -m "not integration" \
            --disable-socket \
            --allow-unix-socket \
            --allow-hosts=127.0.0.1,::1,localhost

      - name: Run deterministic agent CLI tests
        run: python -m pytest -q apps/agent-cli/tests -m "not integration"

      - name: Run deterministic Ollama reference-app tests
        run: python -m pytest -q apps/ollama-chat/tests

      - name: Verify PostgreSQL Ledger release conformance
        run: python -m pytest -q tests/integration/test_postgres_memory_ledger.py -m integration

      - name: Verify frozen semantic memory and dual-backend Ledger evidence
        run: |
          python scripts/run_memory_benchmark.py --suite v0.1 --verify
          python scripts/run_memory_benchmark.py --suite v0.2 --verify
          python scripts/run_memory_benchmark.py --suite v0.3 --verify
          python scripts/run_memory_benchmark.py --suite v1.0 --ledger-backend all --verify

      - name: Build strict Russian and English documentation
        run: python scripts/build_docs.py --clean

      - name: Build core distributions and validate metadata
        run: |
          python -m build --sdist --wheel
          python -m twine check dist/*

      - name: Build agent CLI distributions and validate metadata
        run: |
          python -m build --sdist --wheel --outdir dist-agent-cli apps/agent-cli
          python -m twine check dist-agent-cli/*

      - name: Build source-only Ollama reference distribution
        run: |
          python -m build --wheel --outdir dist-ollama-chat apps/ollama-chat
          python -m twine check dist-ollama-chat/*

      - name: Import PostgreSQL Ledger from a clean wheel without psycopg
        shell: bash
        run: |
          python -m venv /tmp/protoprompt-postgres-lazy-import-smoke
          smoke_python=/tmp/protoprompt-postgres-lazy-import-smoke/bin/python
          "$smoke_python" -m pip install --no-deps dist/*.whl
          cd /tmp
          "$smoke_python" -I -c \
            "import importlib.util; assert importlib.util.find_spec('psycopg') is None; from protoprompt.ledger import PostgresMemoryLedger; assert PostgresMemoryLedger"

      - name: Import reference wheel from a clean release environment
        shell: bash
        run: |
          python -m venv /tmp/protoprompt-ollama-chat-release-smoke
          smoke_python=/tmp/protoprompt-ollama-chat-release-smoke/bin/python
          "$smoke_python" -m pip install --upgrade pip
          "$smoke_python" -m pip install fastapi httpx pypdf python-multipart
          "$smoke_python" -m pip install --no-deps dist/*.whl dist-ollama-chat/*.whl
          cd /tmp
          "$smoke_python" -I -c \
            "from protoprompt_ollama_chat.app import create_app; assert create_app"

      - name: Run pp-agent from a clean release environment
        shell: bash
        run: |
          python -m venv /tmp/protoprompt-agent-cli-release-smoke
          smoke_python=/tmp/protoprompt-agent-cli-release-smoke/bin/python
          "$smoke_python" -m pip install --no-deps dist/*.whl dist-agent-cli/*.whl
          cd /tmp
          test "$(/tmp/protoprompt-agent-cli-release-smoke/bin/pp-agent --version)" = "$(python -c 'from protoprompt_cli import __version__; print(__version__)')"

      - name: Prepare release metadata
        shell: bash
        run: |
          mkdir release-metadata
          cp RELEASE_NOTES.md release-metadata/RELEASE_NOTES.md
          cp SECURITY_REVIEW-v0.16.1.md release-metadata/SECURITY_REVIEW-v0.16.1.md
          (cd dist && sha256sum *.whl *.tar.gz) > release-metadata/PYPI_SHA256SUMS
          {
            (cd dist && sha256sum *.whl *.tar.gz)
            (cd dist-agent-cli && sha256sum *.whl *.tar.gz)
            (cd release-metadata && sha256sum SECURITY_REVIEW-v0.16.1.md)
          } | sort -k 2 > release-metadata/SHA256SUMS
          python - <<'PY'
          import json
          import subprocess
          import tomllib

          with open("pyproject.toml", "rb") as source:
              project = tomllib.load(source)["project"]
          with open("apps/agent-cli/pyproject.toml", "rb") as source:
              agent_cli = tomllib.load(source)["project"]
          manifest = {
              "name": project["name"],
              "version": project["version"],
              "agent_cli": {
                  "name": agent_cli["name"],
                  "version": agent_cli["version"],
              },
              "security_review": "SECURITY_REVIEW-v0.16.1.md",
              "tag": __import__("os").environ["GITHUB_REF_NAME"],
              "commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
          }
          with open("release-metadata/RELEASE_MANIFEST.json", "w", encoding="utf-8") as output:
              json.dump(manifest, output, sort_keys=True)
              output.write("\n")
          PY

      - name: Upload verified distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified agent CLI distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agent-cli-dist
          path: |
            dist-agent-cli/*.whl
            dist-agent-cli/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified release metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-metadata
          path: release-metadata/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: python-dist
          path: dist/

      - name: Download release checksums
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-metadata
          path: release-metadata/

      - name: Verify distribution checksums
        shell: bash
        run: (cd dist && sha256sum --check ../release-metadata/PYPI_SHA256SUMS)

      - name: Publish to TestPyPI via OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: python-dist
          path: dist/

      - name: Download release checksums
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-metadata
          path: release-metadata/

      - name: Verify distribution checksums
        shell: bash
        run: (cd dist && sha256sum --check ../release-metadata/PYPI_SHA256SUMS)

      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

      - name: Verify PyPI records the verified artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import sys
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          manifest = json.loads(
              Path("release-metadata/RELEASE_MANIFEST.json").read_text(encoding="utf-8")
          )
          checksums: dict[str, str] = {}
          for line in Path("release-metadata/PYPI_SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(maxsplit=1)
              filename = filename.removeprefix("*")
              if len(digest) != 64 or any(char not in "0123456789abcdef" for char in digest):
                  raise SystemExit(f"invalid PyPI checksum entry for {filename!r}")
              if filename in checksums:
                  raise SystemExit(f"duplicate PyPI checksum entry for {filename!r}")
              checksums[filename] = digest

          wheels = [name for name in checksums if name.endswith(".whl")]
          sdists = [name for name in checksums if name.endswith(".tar.gz")]
          if len(checksums) != 2 or len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("expected exactly one core wheel and one core sdist for PyPI")
          for filename, expected_digest in checksums.items():
              actual_digest = hashlib.sha256(Path("dist", filename).read_bytes()).hexdigest()
              if actual_digest != expected_digest:
                  raise SystemExit(f"local artifact digest mismatch for {filename}")

          package_name = str(manifest["name"])
          package_version = str(manifest["version"])
          url = "https://pypi.org/pypi/{}/{}/json".format(
              quote(package_name, safe=""), quote(package_version, safe="")
          )
          last_error = "PyPI JSON was not queried"
          for attempt in range(1, 6):
              try:
                  request = Request(url, headers={"Accept": "application/json"})
                  with urlopen(request, timeout=20) as response:
                      payload = json.load(response)
                  if payload.get("info", {}).get("version") != package_version:
                      raise ValueError("PyPI returned a different version")
                  published: dict[str, str] = {}
                  for file_info in payload.get("urls", []):
                      filename = file_info.get("filename")
                      if filename in checksums:
                          if filename in published:
                              raise ValueError(f"duplicate PyPI record for {filename}")
                          digest = file_info.get("digests", {}).get("sha256")
                          if not isinstance(digest, str):
                              raise ValueError(f"PyPI did not return a SHA-256 for {filename}")
                          published[filename] = digest
                  missing = sorted(set(checksums) - set(published))
                  mismatched = sorted(
                      filename
                      for filename, expected in checksums.items()
                      if published.get(filename) != expected
                  )
                  if not missing and not mismatched:
                      print(f"PyPI metadata verified for {package_name} {package_version}.")
                      sys.exit(0)
                  last_error = f"missing={missing}, mismatched={mismatched}"
              except (HTTPError, URLError, OSError, ValueError, json.JSONDecodeError) as error:
                  last_error = str(error)
              if attempt < 5:
                  time.sleep(attempt * 5)
          raise SystemExit(
              f"PyPI metadata did not match verified artifacts after 5 attempts: {last_error}"
          )
          PY

  create-github-release:
    name: create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: python-dist
          path: release-assets/

      - name: Download verified agent CLI distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: agent-cli-dist
          path: release-assets/

      - name: Download verified release metadata
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-metadata
          path: release-assets/

      - name: Verify artifact checksums and create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS
          verify_release() {
            python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from urllib.parse import quote

          repository = os.environ["GITHUB_REPOSITORY"]
          release_tag = os.environ["RELEASE_TAG"]
          manifest = json.loads(Path("RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          if manifest.get("tag") != release_tag:
              raise SystemExit("release manifest tag does not match the workflow tag")
          agent_cli = manifest.get("agent_cli")
          if not isinstance(agent_cli, dict):
              raise SystemExit("release manifest has no agent CLI package metadata")
          if not isinstance(agent_cli.get("name"), str) or not isinstance(agent_cli.get("version"), str):
              raise SystemExit("release manifest has invalid agent CLI package metadata")
          security_review = manifest.get("security_review")
          if security_review != "SECURITY_REVIEW-v0.16.1.md":
              raise SystemExit("release manifest has no valid security review asset")
          expected_commit = manifest.get("commit")
          if not isinstance(expected_commit, str) or len(expected_commit) != 40:
              raise SystemExit("release manifest has no valid source commit")
          if any(char not in "0123456789abcdef" for char in expected_commit):
              raise SystemExit("release manifest has no valid source commit")

          expected_digests: dict[str, str] = {}
          for line in Path("SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(maxsplit=1)
              filename = filename.removeprefix("*")
              if len(digest) != 64 or any(char not in "0123456789abcdef" for char in digest):
                  raise SystemExit(f"invalid SHA256SUMS entry for {filename!r}")
              if filename in expected_digests:
                  raise SystemExit(f"duplicate SHA256SUMS entry for {filename!r}")
              expected_digests[filename] = f"sha256:{digest}"
          wheels = [name for name in expected_digests if name.endswith(".whl")]
          sdists = [name for name in expected_digests if name.endswith(".tar.gz")]
          if len(expected_digests) != 5 or len(wheels) != 2 or len(sdists) != 2:
              raise SystemExit("expected core/CLI wheel/sdist pairs and security review in SHA256SUMS")
          agent_cli_prefix = "{}-{}".format(
              agent_cli["name"].replace("-", "_"), agent_cli["version"]
          )
          agent_cli_assets = [
              name for name in expected_digests if name.startswith(agent_cli_prefix)
          ]
          if (
              len(agent_cli_assets) != 2
              or sum(name.endswith(".whl") for name in agent_cli_assets) != 1
              or sum(name.endswith(".tar.gz") for name in agent_cli_assets) != 1
          ):
              raise SystemExit("SHA256SUMS does not contain the declared agent CLI wheel/sdist pair")
          if security_review not in expected_digests:
              raise SystemExit("SHA256SUMS does not contain the declared security review")
          expected_digests["SHA256SUMS"] = "sha256:" + hashlib.sha256(
              Path("SHA256SUMS").read_bytes()
          ).hexdigest()

          def github_api(path: str) -> dict:
              response = subprocess.check_output(
                  [
                      "gh", "api",
                      "-H", "Accept: application/vnd.github+json",
                      "-H", "X-GitHub-Api-Version: 2022-11-28",
                      path,
                  ],
                  text=True,
              )
              return json.loads(response)

          encoded_tag = quote(release_tag, safe="")
          release = github_api(f"repos/{repository}/releases/tags/{encoded_tag}")
          if release.get("tag_name") != release_tag:
              raise SystemExit("GitHub Release tag does not match the workflow tag")
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("GitHub Release must be a published stable release")

          ref = github_api(f"repos/{repository}/git/ref/tags/{encoded_tag}")
          if ref.get("ref") != f"refs/tags/{release_tag}":
              raise SystemExit("GitHub tag reference does not match the workflow tag")
          target = ref.get("object", {})
          for _ in range(5):
              target_type = target.get("type")
              target_sha = target.get("sha")
              if target_type == "commit":
                  break
              if target_type != "tag" or not isinstance(target_sha, str):
                  raise SystemExit("GitHub tag does not resolve to a commit")
              target = github_api(f"repos/{repository}/git/tags/{target_sha}").get("object", {})
          else:
              raise SystemExit("GitHub tag indirection is too deep")
          if target_type != "commit" or target_sha != expected_commit:
              raise SystemExit("GitHub tag does not target the commit that built the artifacts")

          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("GitHub Release did not return its assets")
          actual_digests: dict[str, str] = {}
          for asset in assets:
              name = asset.get("name")
              digest = asset.get("digest")
              if not isinstance(name, str) or not isinstance(digest, str):
                  raise SystemExit("GitHub Release asset lacks a name or SHA-256 digest")
              if asset.get("state") != "uploaded":
                  raise SystemExit(f"GitHub Release asset {name!r} is not uploaded")
              if name in actual_digests:
                  raise SystemExit(f"duplicate GitHub Release asset {name!r}")
              actual_digests[name] = digest
          if set(actual_digests) != set(expected_digests):
              raise SystemExit(
                   "GitHub Release assets differ from the verified release artifacts and SHA256SUMS"
              )
          mismatched = sorted(
              name for name, expected in expected_digests.items()
              if actual_digests[name] != expected
          )
          if mismatched:
              raise SystemExit(f"GitHub Release asset digest mismatch: {mismatched}")
          print(f"GitHub Release {release_tag} and all asset digests verified.")
          PY
          }

          verify_release_with_retry() {
            for attempt in 1 2 3; do
              if verify_release; then
                return 0
              fi
              if [[ "${attempt}" -lt 3 ]]; then
                sleep $((attempt * 2))
              fi
            done
            return 1
          }

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            verify_release_with_retry
            exit 0
          fi
          gh release create "${RELEASE_TAG}" *.whl *.tar.gz SECURITY_REVIEW-v0.16.1.md SHA256SUMS \
            --title "${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
          verify_release_with_retry
