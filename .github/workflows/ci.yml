name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[chroma,dev]"

      - name: Run tests with coverage
        run: |
          pytest -m "not integration" --cov=protoprompt --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          fail_ci_if_error: false
          slug: ${{ github.repository }}
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: integration tests (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[chroma,dev]"
      - name: Run integration tests
        run: pytest -m integration -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - name: Verify no leftover debug markers
        run: |
          ! grep -RInE "TODO|FIXME|XXX|HACK" protoprompt tests || (echo "found debug markers"; exit 1)
      - name: Verify import surface
        run: python -c "import protoprompt; assert hasattr(protoprompt, '__version__')"

  docs:
    name: build docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - name: Build RU + EN
        run: python scripts/build_docs.py --clean
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    name: deploy docs to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
