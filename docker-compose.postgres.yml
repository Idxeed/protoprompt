services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: protoprompt_test
      POSTGRES_USER: protoprompt
      POSTGRES_PASSWORD: protoprompt
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protoprompt -d protoprompt_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - protoprompt_pgdata:/var/lib/postgresql/data

volumes:
  protoprompt_pgdata:
