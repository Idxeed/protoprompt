site_name: protoprompt
site_description: Надёжная память агента и объяснимый ограниченный контекст для LLM-приложений
site_url: https://idxeed.github.io/protoprompt/
repo_url: https://github.com/Idxeed/protoprompt
repo_name: Idxeed/protoprompt
copyright: MIT

docs_dir: docs/ru
site_dir: site/ru

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  alternate:
    - name: English
      link: /en/
      lang: en

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Главная: index.md
  - Быстрый старт: quickstart.md
  - Концепции:
      - Слои контекста: concepts/context.md
      - Сжатие сессии: concepts/compression.md
      - Токен-бюджет: concepts/budget.md
  - Память:
      - Экспериментальный memory ledger: memory-ledger.md
      - Очистка payload в точном scope (кандидат v1): ledger-scope-payload-purge.md
      - Контракт политики памяти (кандидат v1): memory-policy.md
      - Storage conformance Ledger (кандидат v1): ledger-storage-conformance.md
      - Bounded recall из ledger: ledger-recall.md
      - "RFC: strict recall candidate projection (v7)": rfc-v7-strict-recall-projection.md
      - Возобновление задачи (experimental): task-resume.md
      - Локальное task-resume демо для Ollama (experimental): ollama-task-resume-demo.md
      - Память чат-бота: memory.md
      - RAG по документам: rag.md
      - Профиль пользователя: profile.md
      - LRU-кэш эмбеддингов: memory_cache.md
      - Рабочая память код-агента: agent.md
      - Секреты: secrets.md
  - Обучение:
      - Обзор курса: tutorials/index.md
      - Урок 1. Первая память: tutorials/01-first-bot.md
      - Урок 2. Память сессии: tutorials/02-session-memory.md
      - Урок 3. LRU-кэш эмбеддингов: tutorials/03-embedding-cache.md
      - Урок 4. Память код-агента: tutorials/04-coder-agent.md
      - Урок 5. Профиль пользователя: tutorials/05-user-profile.md
  - Интеграции: integrations.md
  - MCP server: mcp.md
  - OpenAI Agents SDK: openai-agents.md
  - LangGraph: langgraph.md
  - Telegram-бот с памятью: telegram.md
  - PostgreSQL и pgvector: postgres.md
  - OpenTelemetry: opentelemetry.md
  - Redis: redis.md
  - Elasticsearch и OpenSearch: search.md
  - FastAPI service: fastapi.md
  - Локальные document readers: readers.md
  - Провайдеры и фреймворки: providers-frameworks.md
  - Миграция 0.3 → 0.4: migration-0.4.md
  - Миграция 0.3 → 0.6: migration-0.6.md
  - Миграция 0.6 → линия Ledger 1.0: migration-0.6-to-1.0.md
  - Changelog: changelog.md
  - License: license.md
