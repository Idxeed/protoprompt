site_name: protoprompt
site_description: Слоистый сборщик контекста для LLM-промптов
site_url: https://idxeed.github.io/protoprompt/
repo_url: https://github.com/Idxeed/protoprompt
repo_name: Idxeed/protoprompt
copyright: MIT

docs_dir: docs/ru
site_dir: site/ru

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  alternate:
    - name: English
      link: /en/
      lang: en

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Главная: index.md
  - Быстрый старт: quickstart.md
  - Концепции:
      - Слои контекста: concepts/context.md
      - Сжатие сессии: concepts/compression.md
      - Токен-бюджет: concepts/budget.md
  - Интеграции: integrations.md
  - Changelog: changelog.md
  - License: license.md
