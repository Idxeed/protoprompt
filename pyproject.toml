[project]
name = "protoprompt"
version = "0.2.0"
description = "Layered context builder for LLM prompts: RAG + compressed session memory + user profile"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EnergoAI Hub"}]
maintainers = [{name = "EnergoAI Hub"}]
readme = "README.md"
keywords = ["llm", "rag", "prompt", "context", "embedding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
chroma = ["chromadb>=0.5,<0.6"]
tiktoken = ["tiktoken>=0.5"]
http = ["httpx>=0.27"]
ollama = ["httpx>=0.27"]
openai = ["openai>=1.40"]
qdrant = ["qdrant-client>=1.12"]
fastembed = ["fastembed>=0.4"]
local = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "mkdocs>=1.5",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.24",
    "httpx>=0.27",
    "openai>=1.40",
]

[project.urls]
Homepage = "https://github.com/Idxeed/protoprompt"
Documentation = "https://idxeed.github.io/protoprompt/"
Source = "https://github.com/Idxeed/protoprompt"
Issues = "https://github.com/Idxeed/protoprompt/issues"
Changelog = "https://github.com/Idxeed/protoprompt/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["protoprompt*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests requiring external services or optional deps",
]

[tool.coverage.run]
source = ["protoprompt"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 1
