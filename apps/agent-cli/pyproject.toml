[project]
name = "protoprompt-cli"
version = "0.1.0"
description = "Claude-Code-style CLI agent built on protoprompt working memory"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["protoprompt>=0.7.0,<0.8.0"]

[project.optional-dependencies]
ollama = ["httpx>=0.27"]
openai = ["openai>=1.40"]
http = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
pp-agent = "protoprompt_cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["protoprompt_cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring a live LLM backend (Ollama/OpenAI)",
]
